<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>Beam 交互原型</title><style>
:root{--bg:#0b0f17;--panel:#121826;--panel2:#0e1420;--line:#222b3d;--text:#e8edf6;--sub:#8f9ab0;--pri:#5b7cff;--ok:#22c55e;--warn:#f59e0b;--err:#ef4444;--chip:#1a2340}
.light{--bg:#f4f6fb;--panel:#ffffff;--panel2:#eef1f8;--line:#dfe4ee;--text:#151b28;--sub:#5d6880;--pri:#3d5cf5;--ok:#16a34a;--warn:#d97706;--err:#dc2626;--chip:#e7ecff}
*{box-sizing:border-box;margin:0}body{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);padding:16px;font-size:14px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:7px 12px}
button.p{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}button.d{background:var(--err);border-color:var(--err);color:#fff}
.top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.tab.on{background:var(--chip);border-color:var(--pri);color:var(--pri)}
.frame{border:1px solid var(--line);border-radius:12px;background:var(--panel2);overflow:hidden;position:relative}
.win{display:flex;min-height:520px}.side{width:170px;border-right:1px solid var(--line);padding:14px 10px;background:var(--panel)}
.nav{display:block;width:100%;text-align:left;border:0;background:none;margin-bottom:4px}.nav.on{background:var(--chip);color:var(--pri)}
.main{flex:1;padding:20px;position:relative}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.sub{color:var(--sub);font-size:12px}.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--chip)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.err{color:var(--err)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.g{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.seg button{border:0;border-radius:0}.seg .on{background:var(--pri);color:#fff}
.set{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);gap:8px;flex-wrap:wrap}
.modal{position:absolute;inset:0;background:#0008;display:flex;align-items:center;justify-content:center}.modal .card{width:300px;text-align:center}
.qr{width:140px;height:140px;margin:10px auto;display:grid;grid-template-columns:repeat(15,1fr);background:#fff;padding:8px;border-radius:8px}
.game{background:radial-gradient(circle at 30% 40%,#5b3fa8,#14204a 55%,#05070c);color:#fff}
.ov{position:absolute;background:#0a0e18d9;color:#e8edf6;border:1px solid #2a3348;border-radius:10px;padding:10px;font-size:12px}
.phone{width:300px;min-height:540px;margin:auto;border:6px solid var(--line);border-radius:30px;padding:14px;background:var(--bg);position:relative}
.land{width:100%;max-width:640px;height:320px;margin:auto;border:6px solid var(--line);border-radius:24px;position:relative;overflow:hidden}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--sub);border-top-color:var(--pri);border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
.toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:7px 14px;border-radius:8px;font-size:12px}
</style></head><body class="dark"><div id="app"></div><script>
const S={theme:'dark',side:'win',wp:'home',live:false,modal:null,ov:true,res:'1080p',fps:'60',codec:'HEVC',fec:'20%',devs:[{n:'小米 14',ic:'📱',on:true},{n:'客厅 TCL 电视',ic:'📺',on:false}],ap:'list',pin:'',pairErr:false,tool:false,net:'ok',toast:''};
function set(p){Object.assign(S,p);r()}window.set=set;
function toast(t){set({toast:t});setTimeout(()=>set({toast:''}),1600)}
const seg=(k,opts)=>`<span class="seg">${opts.map(o=>`<button class="${S[k]==o?'on':''}" onclick="set({${k}:'${o}'})">${o}</button>`).join('')}</span>`;
const qr=()=>{let h='',s=3;for(let i=0;i<225;i++){s=(s*73+41)%101;const r=i/15|0,c=i%15,f=(r<4&&c<4)||(r<4&&c>10)||(r>10&&c<4);h+=`<i style="background:${(f?((r%11==0||r%11==3||c%11==0||c%11==3)||((r%11==1||r%11==2)&&(c%11==1||c%11==2))):s>50)?'#000':'#fff'}"></i>`}return h};
function perf(c){const rows=[["抓屏 WGC","0.6","1.1"],["颜色转换","0.4","0.7"],["编码 NVENC P1","2.1","3.0"],["分包+FEC","0.2","0.4"],["网络单程","0.4","1.2"],["抖动缓冲","0.0","1.0"],["解码","2.6","4.8"],["渲染/上屏","3.1","6.0"],["端到端","9.4","16.2"]];const k=[["帧率","120"],["码率","96 Mbps"],["丢包/FEC","0.3% / 100%"],["掉帧","2/分钟"],["CPU","7%"],["GPU 编码","34%"],["内存","182 MB"],["RTT","0.8 ms"]];const sp=[9.1,9.6,9.3,10.2,9,9.4,12.8,9.2,9.5,9.1,9.8,9.3,15.9,9.6,9.2,9.4];
return `<div class="row"><b style="font-size:17px">性能统计</b><span class="pill warn" style="border:1px solid var(--warn)">仅 Debug 构建</span></div><div style="display:grid;grid-template-columns:repeat(${c?2:4},1fr);gap:8px;margin:10px 0">${k.map(([a,b])=>`<div class="card" style="margin:0;padding:9px"><div class="sub">${a}</div><b>${b}</b></div>`).join('')}</div><div class="card" style="padding:9px"><div class="sub">端到端延迟 ms(虚线 16.7)</div><svg width="100%" height="60" viewBox="0 0 300 60" preserveAspectRatio="none"><line x1="0" x2="300" y1="10" y2="10" stroke="var(--sub)" stroke-dasharray="4 3"/><polyline fill="none" stroke="var(--pri)" stroke-width="2" points="${sp.map((v,i)=>i*20+','+(60-v*3)).join(' ')}"/></svg></div><div class="card" style="padding:4px 10px">${rows.map(([a,b,p])=>`<div class="set" style="padding:5px 0"><span>${a}</span><span class="sub">均值 ${b} · P99 ${p} ms</span></div>`).join('')}</div><div class="row"><button onclick="toast('已导出 CSV')">导出 CSV</button><button onclick="toast('已导出 JSON')">导出 JSON</button></div>`}
function win(){const nav=[['home','🏠 主机'],['dev','🔗 设备'],['set','⚙️ 设置'],['stream','🖥 串流预览'],['perf','🐞 性能(Debug)']].map(([k,t])=>`<button class="nav ${S.wp==k?'on':''}" onclick="set({wp:'${k}'})">${t}</button>`).join('');
let m='';if(S.wp=='home')m=`<h3>本机 DESKTOP-LEYU</h3><p class="sub">192.168.1.23 · 局域网发现已开启</p><br>
<div class="card"><div class="row"><span class="pill ${S.live?'ok':''}">${S.live?'● 串流中 · 小米 14':'○ 待机中'}</span><span class="g"></span><span class="pill">NVENC · ${S.codec}</span></div>
<p style="margin:12px 0" class="sub">画质 ${S.res} · ${S.fps}fps · 码率自适应</p>${S.live?`<button class="d" onclick="set({live:false});toast('已停止串流')">■ 停止串流</button>`:`<button class="p" onclick="set({live:true});toast('开播成功,等待客户端连接')">▶ 一键开播</button>`} <button onclick="set({modal:'pair'})">＋ 配对新设备</button></div>
<div class="card"><b>最近连接</b>${S.devs.map(d=>`<div class="set"><span>${d.ic} ${d.n}</span><span class="${d.on?'ok':'sub'}">${d.on?'在线':'离线'}</span></div>`).join('')}</div>`;
if(S.wp=='dev')m=`<h3>已配对设备</h3><br>`+(S.devs.length?`<div class="card">${S.devs.map((d,i)=>`<div class="set"><span>${d.ic} ${d.n} <span class="sub">指纹 9F:2A:…:C${i}</span></span><button onclick="S.devs.splice(${i},1);toast('已移除 ${d.n}')">移除</button></div>`).join('')}</div>`:`<div class="card" style="text-align:center;padding:40px"><div style="font-size:30px">🔗</div><p>还没有配对的设备</p><p class="sub">在手机上打开 Beam 扫码即可添加</p><br><button class="p" onclick="set({modal:'pair'})">配对新设备</button></div>`);
if(S.wp=='set')m=`<h3>设置</h3><br><div class="card"><b>画质</b><div class="set">分辨率 ${seg('res',['720p','1080p','1440p','4K'])}</div><div class="set">帧率 ${seg('fps',['30','60','120'])}</div></div>
<div class="card"><b>编码</b><div class="set">格式 ${seg('codec',['H.264','HEVC','AV1'])}</div></div><div class="card"><b>网络</b><div class="set">FEC 冗余 ${seg('fec',['10%','20%','30%'])}</div></div>`;
if(S.wp=='stream')m=`<div class="frame game" style="height:440px;position:relative"><div style="position:absolute;left:20px;bottom:16px;opacity:.3;font-size:40px;font-weight:800">GAME</div>
<button style="position:absolute;left:10px;top:10px" onclick="set({ov:!S.ov})">📊 ${S.ov?'隐藏':'显示'}统计</button>
${S.ov?`<div class="ov" style="right:10px;top:10px;width:220px"><b>端到端 <span style="color:#22c55e">17.8 ms</span></b><br>抓屏 2.4 · 编码 3.9 · 网络 3.2<br>解码 4.3 · 显示 4.0 ms<br>${S.res} @ ${S.fps} · ${S.codec}<br>丢包 0.4% · FEC ${S.fec}</div>`:''}</div>`;
if(S.wp=='perf')m=perf(false);
const mod=S.modal=='pair'?`<div class="modal" onclick="if(event.target==this)set({modal:null})"><div class="card"><b>配对新设备</b><p class="sub">用 Beam 安卓 App 扫码,或输入 PIN</p><div class="qr">${qr()}</div><div style="font-size:28px;letter-spacing:8px;font-weight:700">4827</div><p class="sub"><span class="spin"></span> 等待设备… 2:00 后刷新</p><br><button onclick="set({modal:null})">取消</button> <button class="p" onclick="S.devs.push({n:'Redmi K70',ic:'📱',on:true});set({modal:null});toast('Redmi K70 配对成功')">模拟配对成功</button></div></div>`:'';
return `<div class="frame win"><div class="side"><b style="color:var(--pri)">◆ Beam</b><br><br>${nav}</div><div class="main">${m}${mod}${S.toast?`<div class="toast">${S.toast}</div>`:''}</div></div>`}
function and(){let m='';
if(S.ap=='list')m=`<div class="row"><h3 class="g">Beam</h3><button onclick="set({ap:'perf'})">🐞</button><button onclick="set({ap:'set'})">⚙️</button></div><p class="sub"><span class="spin"></span> 正在搜索局域网…</p><br>
<div class="card" onclick="set({ap:'stream',net:'ok'})" style="cursor:pointer"><b>🖥 DESKTOP-LEYU</b> <span class="ok" style="float:right">已配对</span><p class="sub">RTX 4070 · 点击直接连接</p></div>
<div class="card" onclick="set({ap:'pair',pin:'',pairErr:false})" style="cursor:pointer"><b>🖥 GAME-PC</b> <span class="pill" style="float:right">未配对</span><p class="sub">192.168.1.80 · 点击配对</p></div>
<div class="card" style="opacity:.6"><b>💻 书房笔记本</b> <span class="sub" style="float:right">离线</span></div>`;
if(S.ap=='pair')m=`<button onclick="set({ap:'list'})">← 返回</button><h3 style="margin:10px 0">配对 GAME-PC</h3><div class="game" style="height:170px;border-radius:12px;display:flex;align-items:center;justify-content:center"><div style="width:110px;height:110px;border:3px solid #7aa2ff;border-radius:10px"></div></div><p class="sub" style="text-align:center;margin:8px">对准主机上的二维码,或输入 PIN</p>
<div class="row" style="justify-content:center">${[0,1,2,3].map(i=>`<span class="card" style="margin:0;width:44px;text-align:center;font-size:22px;${S.pairErr?'border-color:var(--err)':''}">${S.pin[i]||'_'}</span>`).join('')}</div>
${S.pairErr?`<p class="err" style="text-align:center;margin-top:8px">PIN 错误,请核对主机屏幕上的数字(剩余 2 次)</p>`:''}
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px">${[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].map(k=>`<button onclick="key('${k}')">${k}</button>`).join('')}</div><p class="sub" style="margin-top:6px">提示:输入 4827 成功,其他数字演示失败</p>`;
if(S.ap=='set')m=`<button onclick="set({ap:'list'})">← 返回</button><h3 style="margin:10px 0">串流设置</h3><div class="card"><div class="set">分辨率 ${seg('res',['720p','1080p'])}</div><div class="set">帧率 ${seg('fps',['30','60','120'])}</div><div class="set">解码器<span class="sub">c2.qti.hevc 硬解</span></div><div class="set">统计浮层 <button onclick="set({ov:!S.ov})">${S.ov?'开':'关'}</button></div></div>`;
if(S.ap=='perf')m=`<button onclick="set({ap:'list'})">← 返回</button><br><br>`+perf(true);
if(S.ap=='stream')return `<div class="land game"><div style="position:absolute;left:20px;bottom:14px;opacity:.3;font-size:36px;font-weight:800">GAME</div>
${S.ov?`<div class="ov" style="left:10px;top:10px"><span style="color:${S.net=='ok'?'#22c55e':'#f59e0b'}">●</span> ${S.net=='ok'?'18ms · '+S.res+S.fps+' · 19Mbps':'网络波动'}</div>`:''}
<div style="position:absolute;top:10px;right:10px;display:flex;gap:6px">${S.tool?['⌨️','🎮','🖱'].map(i=>`<button style="background:#0a0e18d9;color:#fff;border-color:#2a3348">${i}</button>`).join('')+`<button style="background:#0a0e18d9;color:#fff;border-color:#2a3348" onclick="set({ov:!S.ov})">📊</button><button style="background:#0a0e18d9;color:#fff;border-color:#2a3348" onclick="set({net:'lost'});setTimeout(()=>set({net:'ok'}),2500)">⚡断网测试</button><button class="d" onclick="set({ap:'list',tool:false})">⏻</button>`:''}<button style="background:#0a0e18d9;color:#fff;border-color:#2a3348" onclick="set({tool:!S.tool})">${S.tool?'›':'‹ 工具'}</button></div>
${S.net=='lost'?`<div class="modal" style="background:#000a;color:#fff;flex-direction:column;gap:8px"><span class="spin"></span>连接中断,正在重连…(保留最后一帧)</div>`:''}</div>`;
return `<div class="phone">${m}${S.toast?`<div class="toast">${S.toast}</div>`:''}</div>`}
window.key=k=>{if(k=='⌫')return set({pin:S.pin.slice(0,-1),pairErr:false});if(k=='✓'||S.pin.length>=3){const p=k=='✓'?S.pin:S.pin+k;if(p=='4827'){set({pin:p});setTimeout(()=>set({ap:'stream',net:'ok'}),500);toast('配对成功')}else set({pin:'',pairErr:true});return}set({pin:S.pin+k,pairErr:false})};
function r(){document.body.className=S.theme;document.getElementById('app').innerHTML=`<div class="top"><button class="tab ${S.side=='win'?'on':''}" onclick="set({side:'win'})">Windows 端</button><button class="tab ${S.side=='and'?'on':''}" onclick="set({side:'and'})">Android 端</button><span class="g"></span><button onclick="set({theme:S.theme=='dark'?'light':'dark'})">${S.theme=='dark'?'☀️ 浅色':'🌙 深色'}</button></div>`+(S.side=='win'?win():and())}r();
</script></body></html>
