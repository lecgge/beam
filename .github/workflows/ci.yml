# Beam CI
#
# 依据 docs/beam-tech-design.md §7「构建与发布」：
#   - fmt / clippy / test（Linux 跑纯逻辑 crate，Windows runner 跑平台 crate 编译）
#   - Android assemble + 单测
#   - release 产物检查无 perf 符号（perf-stats feature 默认关闭）
#   - cargo-deny 许可证检查
#
# release 无 perf 符号的可执行校验实现在 tools/ci/check-no-perf/（详见该目录 README）：
#   - Android：扫 APK 内 classes*.dex 的类名字符串 + R8 映射表交叉验证。
#     旧的 `unzip -l "$APK" | grep -i "feature-perf|perfstats"` 扫的是 **zip 条目名**，
#     类名不在条目名里 → 恒通过、门禁空转，已废弃。
#   - Rust：扫 release 产物里的 perf 采集符号；Linux 额外叠加文档 §7:275 的 `nm -C` 口径。
#
# 每条 perf 门禁都配了一个**负样本自检**步骤：门禁必须能证明自己抓得到东西，
# 否则视为失效（这正是本批要修的「门禁恒通过」问题）。
#
# 说明：CI 不做代码签名（Windows 安装包与 Android release keystore 走 CI secret）。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-linux:
    name: Rust · 纯逻辑 crate (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: fmt
        shell: bash
        run: cargo fmt --all --check
      - name: clippy
        shell: bash
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Linux 只跑与平台无关的 crate：capture/encode/decode/render/input 是 windows only，
      # 其余 crate 的纯逻辑部分在 Linux 上必须全绿。
      - name: test
        shell: bash
        run: cargo test --workspace --exclude beam-capture --exclude beam-encode --exclude beam-decode --exclude beam-render --exclude beam-input
      - name: perf-stats 不得进入默认依赖解析
        shell: bash
        run: |
          if cargo tree -e features | grep -q "beam-perf.*perf-stats"; then
            echo "::error::perf-stats 进入了默认特性解析结果"
            exit 1
          fi
      # §7:275：release 产物不得含 perf 符号。Linux 上按文档口径用 `nm -C` 反混淆扫描
      # （beam-perf 是唯一持有 perf 采集实现的 crate，workspace 内没有 crate 依赖它）。
      - name: release 产物无 perf 符号（nm -C）
        shell: bash
        run: |
          cargo build --release -p beam-perf
          python3 tools/ci/check-no-perf/rust_no_perf.py --target-dir target/release --require-nm
      # 负样本自检：perf-stats 开启时必须被 **nm 通道** 检出，
      # 否则说明上面那道门禁已经空转。
      - name: 门禁自检（perf-stats 开启的产物必须被检出）
        shell: bash
        run: |
          CARGO_TARGET_DIR="$RUNNER_TEMP/beam-perf-perf-on" cargo build --release -p beam-perf --features perf-stats
          python3 tools/ci/check-no-perf/rust_no_perf.py --target-dir "$RUNNER_TEMP/beam-perf-perf-on/release" --require-nm --expect nm-perf

  rust-windows:
    name: Rust · 全量含平台 crate (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: fmt
        shell: pwsh
        run: cargo fmt --all --check
      - name: check（含 windows only crate）
        shell: pwsh
        run: cargo check --workspace --all-targets
      # 平台后端（§3.5 WGC 抓屏 / §3.8 渲染）默认是**关**的，
      # 上面的默认 check 根本不会编译它们 —— 接线坏了也没人知道。
      # windows-capture 与 windows 绑定都是**纯 Rust**，不需要 ffmpeg 开发库，
      # 所以这两条可以进 CI。
      # 硬编/硬解（beam-encode/ffmpeg、beam-decode/ffmpeg）需要 ffmpeg 开发库，
      # §7 要求 LGPL 构建，CI 引入发行版前**不进 CI**（本地已验证）。
      - name: check 平台后端（wgc / d3d11，纯 Rust）
        shell: pwsh
        run: |
          cargo check -p beam-capture --features wgc --all-targets
          cargo check -p beam-render --features d3d11 --all-targets
          cargo check -p beam-host --features platform-wgc --all-targets
      - name: test
        shell: pwsh
        run: cargo test --workspace
      # §7:275：release 产物不得含 perf 符号。
      # Windows runner 没有 nm（`nm -C` 不可用），改用跨平台的字节级扫描 ——
      # 等价于 `grep -a` 直接扫二进制，能认出 legacy mangling 的 `_ZN9beam_perf7collect…`。
      - name: release 产物无 perf 符号
        shell: pwsh
        run: |
          cargo build --release --workspace
          python tools/ci/check-no-perf/rust_no_perf.py --target-dir target/release
      # 负样本自检：perf-stats 开启时必须被检出，否则说明上面那道门禁已经空转。
      - name: 门禁自检（perf-stats 开启的产物必须被检出）
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = "${{ runner.temp }}\beam-perf-perf-on"
          cargo build --release -p beam-perf --features perf-stats
          python tools/ci/check-no-perf/rust_no_perf.py --target-dir "$env:CARGO_TARGET_DIR/release" --expect perf
      - name: cargo-deny 许可证检查
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: Cargo.toml

  android:
    name: Android · assemble + 单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: 单元测试
        working-directory: android
        shell: bash
        run: ./gradlew test
      - name: debug 构建
        working-directory: android
        shell: bash
        run: ./gradlew :app:assembleDebug
      # §7:276：release APK 内不得出现 perf 相关类。
      # 检查对象是 **classes*.dex 里的类名字符串**（流式读进内存，不落盘），
      # 并用 R8 映射表交叉验证「类是否被混淆保留在包里」。
      # §7 分发渠道：store / internal 两个 flavor 都要查 —— 只查一个的话，
      # 另一个 flavor 里混进 perf 类不会被发现（门禁静默失效）。
      - name: release APK 无 perf 类
        working-directory: android
        shell: bash
        run: |
          ./gradlew :app:assembleRelease
          python3 ../tools/ci/check-no-perf/apk_no_perf.py \
            --apk 'app/build/outputs/apk/store/release/*.apk' \
                  'app/build/outputs/apk/internal/release/*.apk' \
            --mapping 'app/build/outputs/mapping/storeRelease/mapping.txt' \
                     'app/build/outputs/mapping/internalRelease/mapping.txt'
      # 负样本自检：debug APK 里含 :feature-perf 的类（debugImplementation），
      # 必须被抓到，否则说明上面那道门禁已经空转。
      - name: 门禁自检（debug APK 必须被检出）
        working-directory: android
        shell: bash
        run: |
          python3 ../tools/ci/check-no-perf/apk_no_perf.py \
            --apk 'app/build/outputs/apk/store/debug/*.apk' \
                  'app/build/outputs/apk/internal/debug/*.apk' \
            --expect perf

  desktop:
    name: 桌面端 · 前端构建 + Rust 检查
    runs-on: windows-latest
    # apps/desktop 尚未落地（文档 §9 桌面端属后续里程碑），目录不存在时整条流水线会红，
    # 因此先按路径存在性跳过，等桌面端工程落地后自动生效。
    if: ${{ hashFiles('apps/desktop/package.json') != '' }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: npm ci
        shell: pwsh
        run: npm ci
      - name: npm run build
        shell: pwsh
        run: npm run build
      - name: src-tauri 检查
        shell: pwsh
        run: cargo check
      # 桌面端的主机模式接线（监听 / 信任闸门 / 会话编排 / WGC 真后端）。
      # host-platform-wgc 只开 WGC(纯 Rust),不需要 ffmpeg 开发库；
      # 真画面要开 host-platform,那一条需要 ffmpeg 开发库,暂不进 CI。
      - name: src-tauri 主机模式检查（host-platform-wgc）
        shell: pwsh
        run: cargo check --features host-platform-wgc
