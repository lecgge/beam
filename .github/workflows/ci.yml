# Beam CI
#
# 依据 docs/beam-tech-design.md §7「构建与发布」：
#   - fmt / clippy / test（Linux 跑纯逻辑 crate，Windows runner 跑平台 crate 编译）
#   - Android assemble + 单测
#   - release 产物检查无 perf 符号（perf-stats feature 默认关闭）
#   - cargo-deny 许可证检查
#
# 说明：CI 不做代码签名（Windows 安装包与 Android release keystore 走 CI secret）。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-linux:
    name: Rust · 纯逻辑 crate (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Linux 只跑与平台无关的 crate：capture/encode/decode/render/input 是 windows only，
      # 其余 crate 的纯逻辑部分在 Linux 上必须全绿。
      - name: test
        run: cargo test --workspace --exclude beam-capture --exclude beam-encode --exclude beam-decode --exclude beam-render --exclude beam-input
      - name: perf-stats 不得进入默认依赖解析
        run: |
          if cargo tree -e features | grep -q "beam-perf.*perf-stats"; then
            echo "::error::perf-stats 进入了默认特性解析结果"
            exit 1
          fi

  rust-windows:
    name: Rust · 全量含平台 crate (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: check（含 windows only crate）
        run: cargo check --workspace --all-targets
      - name: test
        run: cargo test --workspace
      # §7：release 产物不得含 perf 符号
      - name: release 产物无 perf 符号
        shell: pwsh
        run: |
          cargo build --release --workspace
          $hits = Get-ChildItem target\release -Recurse -Include *.dll,*.exe -ErrorAction SilentlyContinue |
            Select-String -Pattern 'perf_span|perf::' -List -ErrorAction SilentlyContinue
          if ($hits) { Write-Error "release 产物中出现 perf 符号：$($hits.Path)"; exit 1 }
      - name: cargo-deny 许可证检查
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: Cargo.toml

  android:
    name: Android · assemble + 单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: 单元测试
        working-directory: android
        run: ./gradlew test
      - name: debug 构建
        working-directory: android
        run: ./gradlew :app:assembleDebug
      # §7：release APK 内不得出现 perf 相关类
      - name: release APK 无 perf 类
        working-directory: android
        run: |
          ./gradlew :app:assembleRelease
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          if unzip -l "$APK" | grep -qi "feature-perf\|perfstats"; then
            echo "::error::release APK 中出现 perf 相关类"
            exit 1
          fi

  desktop:
    name: 桌面端 · 前端构建 + Rust 检查
    runs-on: windows-latest
    # apps/desktop 尚未落地（文档 §9 桌面端属后续里程碑），目录不存在时整条流水线会红，
    # 因此先按路径存在性跳过，等桌面端工程落地后自动生效。
    if: ${{ hashFiles('apps/desktop/package.json') != '' }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: src-tauri 检查
        working-directory: apps/desktop/src-tauri
        run: cargo check

