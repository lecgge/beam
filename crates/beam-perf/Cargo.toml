[package]
name = "beam-perf"
description = "Beam 性能统计:分段耗时直方图、环形缓冲、CSV/JSON 导出(feature = perf-stats,§3.13)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
# §3.13 / §7：性能统计只在 debug 构建开启，release 禁止开启。
perf-stats = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"

# §3.13 性能预算（采集开销 < 1% CPU，单点 < 200 ns）的实测基准。
# 自带计时循环，不引入第三方基准框架，避免牵动工作区依赖树。
[[bench]]
name = "record_overhead"
path = "benches/record_overhead.rs"
harness = false

[lints]
workspace = true
