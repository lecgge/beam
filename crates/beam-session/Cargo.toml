[package]
name = "beam-session"
description = "Beam 会话层:主/客会话状态机、能力协商、重连、统计汇总(§3.9)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
beam-proto = { workspace = true }
# §3.3 配对流程（`PairRequest` / `PairChallenge` / `PairOk` / `PairFail`）由 beam-pair 提供；
# beam-pair 的 crate 文档也写明「被依赖：net、session、ffi」。
beam-pair = { workspace = true }
# §4 允许 `session → net`（L2 → L1）：QUIC 会话传输适配器（`NetTransport`）放在本层，
# L3 的 beam-client 与 beam-ffi 复用同一份实现（§4 不允许 L3 横向依赖）。
# beam-net 只依赖 beam-proto / beam-pair，不会形成循环依赖。
beam-net = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
# §6「tokio 只用于网络与控制」：QUIC 流的读写原语
# （`tokio::io::AsyncRead` / `AsyncWrite`，quinn 直接实现了这两个 trait）。
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# 回环测试需要一个异步运行时（tokio 已在工作区依赖表里，见 workspace Cargo.toml）。
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
