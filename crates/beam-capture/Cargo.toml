[package]
name = "beam-capture"
description = "Beam 抓屏层:WGC / DXGI 抓屏,输出 D3D11 纹理(§3.5,Windows only)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
# 真实 WGC 抓屏实现（依赖 windows-capture）。
wgc = ["dep:windows-capture"]
# §3.13 / §7：性能统计（perf-stats）默认关闭，release 禁止开启。
# 开启后本 crate 的抓屏路径会通过 beam-perf 采集「抓屏」阶段耗时；
# `beam-perf/perf-stats` 必须一起打开，否则采集宏仍然展开为空（§3.13 门控）。
perf-stats = ["dep:beam-perf", "beam-perf/perf-stats"]

[dependencies]
beam-config = { workspace = true }
# §3.13：perf 可被任意层以 feature 可选依赖接入（§4 分层规则）。
beam-perf = { workspace = true, optional = true }
beam-proto = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Foundation",
    "Foundation_Metadata",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
] }
# windows-capture 1.5 内部固定使用 windows 0.61（它自己的依赖树决定的），
# 而本 crate 对外暴露的是 windows 0.62 的 ID3D11Texture2D（与 beam-encode 同型，
# §6 的「capture→encode 同一设备零拷贝」要求两者是同一个类型）。
# 这里显式引入 0.61 只用于把 windows-capture 交出的 COM 指针桥接回 0.62，
# 不出现在任何对外 API 上。详见 src/wgc.rs 的「版本桥接」说明。
windows_legacy = { package = "windows", version = "0.61.3", features = [
    "Win32_Graphics_Direct3D11",
] }
windows-capture = { workspace = true, optional = true }

# 抓屏阶段埋点验证入口（§3.13）：真的用 WGC 抓屏，打印 Perf::snapshot()。
# 需要真实显示器与交互式桌面会话，以及 perf-stats（要真的采集）。
[[example]]
name = "perf_probe"
required-features = ["wgc", "perf-stats"]

[lints]
workspace = true
