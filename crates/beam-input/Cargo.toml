[package]
name = "beam-input"
description = "Beam 输入层:SendInput 键鼠注入、ViGEm 虚拟手柄、震动回传(§3.8,Windows only)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["vigem"]
# §7：`vigem` 默认开。关闭后手柄挂载返回 E8001（ViGEmBus 未安装）。
vigem = ["dep:vigem-client"]

[dependencies]
beam-proto = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    # §6：注入线程用 MMCSS "Games"（AvSetMmThreadCharacteristicsW /
    # AvSetMmThreadPriority）与退路 SetThreadPriority，都在
    # Win32::System::Threading 里。
    "Win32_System_Threading",
] }
vigem-client = { workspace = true, optional = true }

[dev-dependencies]
# I-13 延迟基准（criterion 已在 workspace 里，不动根 Cargo.toml）。
criterion = { workspace = true }

# 注入热路径基准（harness = false：criterion 自带 harness）。
[[bench]]
name = "inject_latency"
harness = false

[lints]
workspace = true
