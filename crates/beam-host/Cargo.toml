[package]
name = "beam-host"
description = "Beam 主机编排层:组装 capture/encode/audio/input/discovery 与会话(§3.9)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
# 真实 Opus 编解码（ffmpeg 的**原生** opus 编码器，与 `beam-audio/opus` 同一个后端）。
#
# 主机侧靠它把 WASAPI loopback 采到的 PCM 编码成 Opus 帧。
# 不开这个 feature 时音频链路**接线仍然完整**，但 `OpusEncoderImpl::new` 返回
# E7004（后端未启用）⇒ 主机降级为「只有画面」，错误码写进日志与统计。
opus = ["beam-audio/opus"]

# 平台会话（§3.9 主机编排 + §3.5/§3.6 平台后端）。
#
# 打开后把 beam-capture 的 `wgc`（WGC 抓屏）与 beam-encode 的 `ffmpeg`
# （NVENC/AMF/QSV 硬编）两个后端**传递进来**：本 crate 是 §4 允许引用平台
# crate 的那一层（host/client），桌面端因此**不需要**直接依赖平台 crate，
# 只需打开本 feature（`beam-host/platform`）。
#
# 默认关闭：不开这个 feature 时本 crate 不碰任何原生 API，
# 编译产物也不需要 ffmpeg / windows-capture 工具链。
#
# `opus` 一并打开：`platform` 已经需要 §7 的 LGPL ffmpeg 构建，
# 音频的 Opus 编解码用的是同一套原生库，不额外增加依赖面。
platform = ["platform-wgc", "beam-encode/ffmpeg", "opus"]

# 只开 WGC 抓屏（windows-capture 是**纯 Rust**，不需要 ffmpeg 开发库）。
#
# 用途：让 CI 能在没有 ffmpeg 的机器上**编译检查**「主机编排 + WGC 真后端」
# 这条路径 —— 否则 §3.5 的 WGC 接线在 CI 里根本不会被编译，坏了也没人知道。
#
# 注意：只开这个 feature 时，硬编后端是关的（`HardwareVideoEncoder::open`
# 返回 `BackendDisabled`），运行时**不出画面**；它只是让 CI 能查编译。
platform-wgc = ["beam-capture/wgc"]

# 客户端画面验证路径（§3.10 / 产品方案第 45 行）：真机解码 + 真上屏。
#
# §4 规定平台 crate（decode / render）**只能**被 host / client 引用 ——
# 本 crate 是那一层，因此引入它们不违反分层；而且它们是**可选依赖**，
# 默认构建不碰任何原生 API（§7：perf-stats 之外的原生后端默认关闭）。
#
# 用途：整链验证入口 `examples/client_loopback.rs` —— 主机侧真的抓屏 + 硬编，
# 客户端侧真的硬解 + 上屏到独立原生窗口（§3.10「画面不走 WebView」）。
#
# `beam-decode/ffmpeg` 需要 LGPL 构建的 ffmpeg（§7），所以这个 feature
# 默认关闭，且示例用 `required-features` 声明 ⇒ CI 的默认构建不会碰它。
client-video = ["dep:beam-decode", "dep:beam-render", "beam-decode/ffmpeg", "beam-render/d3d11"]

# 性能采集（§3.13）：把整链验证入口的各阶段耗时真的采下来，
# 对照 §3.10 的渲染预算（解码 T1 ≤8 ms、上屏等待平均半帧）。
#
# §7：release 禁止开启 perf-stats —— 所以这是**独立**的 feature，
# 默认关，验证时手动打开。
perf-stats = [
    "dep:beam-perf",
    "beam-perf/perf-stats",
    "beam-decode/perf-stats",
    "beam-render/perf-stats",
]

[dependencies]
beam-proto = { workspace = true }
beam-session = { workspace = true }
beam-capture = { workspace = true }
beam-encode = { workspace = true }
beam-audio = { workspace = true }
beam-input = { workspace = true }
beam-discovery = { workspace = true }
beam-net = { workspace = true }
# 主机侧信任闸门要用 `PeerVerifier` 与 `TrustStore`（§3.3 信任库 / 产品方案 §8）。
beam-pair = { workspace = true }
beam-config = { workspace = true }
beam-log = { workspace = true }
# 客户端画面验证路径的可选依赖（§3.10）：硬解 + 上屏。
# §4：平台 crate 只能被 host / client 引用 —— 本 crate 属于那一层。
# 默认关闭；`client-video` feature 才打开（见上）。
beam-decode = { workspace = true, optional = true }
beam-render = { workspace = true, optional = true }
# §3.13 的性能采集器（可选依赖，`perf-stats` feature 才打开）。
beam-perf = { workspace = true, optional = true }
# §5 控制流 / 输入流的读写原语（quinn 直接实现了 tokio 的 AsyncRead / AsyncWrite）。
tokio = { workspace = true }
# `beam_proto::encode` 的输出缓冲类型（§5 线上格式）。
bytes = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
bytes = { workspace = true }
# 示例要驱动 mDNS 浏览流（`futures::Stream`）。
futures = { workspace = true }
# 整链示例要把 tracing 打到 stderr，才能看到主机侧的**真实**错误。
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# 真机回环验证入口（§9 M-1 验证点）：本机起一个监听 + 一个客户端，
# 验证「监听建立 → 客户端连上 → Hello 协商成功 → 双方状态到 Streaming」。
# 需要真实的 WGC 抓屏与 NVENC 硬编，因此要求 `platform` feature。
[[example]]
name = "host_loopback"
required-features = ["platform"]

# 整链验证入口（§3.10 / 产品方案第 45 行）：
# 主机侧真抓屏 + 真硬编 → QUIC → 客户端侧真硬解 + 真上屏到独立原生窗口。
#
# 与 `host_loopback` 的差别：那个的客户端只数帧，这个的客户端**真的解码并上屏**，
# 并统计「真的搬进交换链」的帧数（`PresentInfo`）—— 那才是画面上屏的证据。
#
# 需要 `platform`（主机侧真后端）与 `client-video`（客户端侧硬解 + 上屏），
# 两者都要 ffmpeg 开发库（§7）。
[[example]]
name = "client_loopback"
required-features = ["platform", "client-video"]

[lints]
workspace = true
