[package]
name = "beam-client"
description = "Beam 客户端编排层:组装 decode/render 与会话(§3.9/§3.10)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
# 真实 Opus 解码（ffmpeg 的**原生** opus 解码器，与 `beam-audio/opus` 同一个后端）。
#
# 客户端要靠它把主机发来的 Opus 帧解码成 PCM 再送进 WASAPI 输出。
# 不开这个 feature 时音频链路**接线仍然完整**，但 `OpusDecoderImpl::new` 返回
# E7004（后端未启用）⇒ 客户端降级为「只有画面」，错误码写进日志与统计。
opus = ["beam-audio/opus"]
# 客户端真实解码 + 上屏（§3.10）。
#
# - `beam-render/d3d11`：D3D11 flip-model 交换链（原生窗口上屏）；
# - `beam-decode/ffmpeg`：D3D11VA 硬解（需要 FFMPEG_DIR 指向 LGPL 构建的 ffmpeg，§7）。
#
# §4 的分层要求：平台 crate（decode/render）**只能**被 host/client 引用，
# 因此「打开这两个后端」的开关必须放在本 crate（L3），
# 桌面端（L4）只能通过 `beam-client/video` 间接打开，不能直接依赖平台 crate。
video = ["beam-render/d3d11", "beam-decode/ffmpeg"]

[dependencies]
beam-proto = { workspace = true }
beam-session = { workspace = true }
beam-decode = { workspace = true }
beam-render = { workspace = true }
beam-net = { workspace = true }
# §3.7 音频：客户端侧要「Opus 解码 + WASAPI 输出」。
# §4 允许 L3（host/client）引用平台 crate；`beam-audio` 的模块文档也写明
# 「被依赖：beam-host、beam-client、beam-ffi」。
beam-audio = { workspace = true }
# §4「只允许上层依赖下层」：client(L3) 需要 pair(L1) 的 PeerVerifier 来校验主机证书。
beam-pair = { workspace = true }
beam-discovery = { workspace = true }
beam-config = { workspace = true }
# 分帧编解码统一由 beam-net::framing 提供（§5 线上格式的唯一真值来源），
# 本 crate 不再自带实现，因此不再直接依赖 bytes。
# `futures` 只用于 `block_on` 与无环 waker。
futures = { workspace = true }
# §6「tokio 只用于网络与控制」：控制 / 输入流的读写原语
# （`tokio::io::AsyncRead` / `AsyncWrite`，quinn 直接实现了这两个 trait）。
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
bytes = { workspace = true }
# 回环测试需要主机侧的 QUIC 接受端（已下沉到 beam-host）。
beam-host = { workspace = true }

[lints]
workspace = true
